[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tremor-lab"
version = "1.0.0"
description = "Aftershock-sequence statistics: completeness, Gutenberg-Richter b-value, Omori-Utsu decay, and magnitude-energy relations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "H. Kazarian" }]
keywords = ["seismology", "aftershocks", "gutenberg-richter", "b-value", "omori-utsu"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
tremor-lab = "tremor_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# ruff formats Python inside Markdown fences too; the README aligns its example
# comments for readability, so prose is left alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]
