[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tremor-lab"
version = "1.1.0"
description = "Aftershock-sequence statistics: completeness, Gutenberg-Richter b-value, Omori-Utsu decay, and magnitude-energy relations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aik Kazarian" }]
keywords = ["seismology", "aftershocks", "gutenberg-richter", "b-value", "omori-utsu"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
# ruff is pinned to an exact version, which is unusual for a dependency and
# right for a formatter. Continuous integration installed 0.16.6 the day after a
# local 0.16.5 formatted this package, the two disagreed about one construct in
# analysis.py, and the build went red on source nobody had touched. A formatter
# whose output can change under you is a build that fails for reasons unrelated
# to the code. Raise this deliberately, and reformat in the same commit.
dev = ["pytest>=8,<9", "ruff==0.16.6"]

[project.scripts]
tremor-lab = "tremor_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# ruff formats Python inside Markdown fences too; the README aligns its example
# comments for readability, so prose is left alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]
