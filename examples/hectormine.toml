# The 1999 Hector Mine sequence: the CONTROL for the decay-fit finding. A clean
# single mainshock, M 7.1, with no M 6 or larger event in the following fortnight,
# so a rejection here cannot be blamed on a doublet. See section 9d of
# docs/PROVENANCE_AND_VALIDATION.md - it is rejected as hard as the doublets are,
# which is why the doublet explanation is no longer claimed.
#
# The catalogue is committed beside this file as hectormine.csv, exactly as it was
# downloaded, so the run below needs no network access. To fetch it again, which
# returns a slightly different file because ComCat revises magnitudes and adds
# events, use two queries, because the service caps a query at 20,000 events:
#
#   BASE="https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv"
#   BASE="$BASE&latitude=34.6033&longitude=-116.265&maxradiuskm=100"
#   BASE="$BASE&minmagnitude=1.0&orderby=time-asc"
#   curl -o h1.csv "$BASE&starttime=1999-10-16T09:46:44&endtime=1999-11-16T00:00:00"
#   curl -o h2.csv "$BASE&starttime=1999-11-16T00:00:00&endtime=2000-04-13T09:46:44"
#   head -1 h1.csv > hectormine.csv
#   for f in h1 h2; do tail -n +2 $f.csv >> hectormine.csv; done
#
# Downloaded this way on 8 September 2026: 13,526 events, the mainshock's own record
# first. The window excludes events at or before the origin time given below, so that
# time is the mainshock's ComCat timestamp with its fraction of a second. Rounded
# down to 09:46:44 the mainshock would sit inside its own aftershock sample.

# 1999 Hector Mine, California: M 7.1, a SINGLE mainshock with no comparable
# second event - the control for the doublet finding.
[catalog]
path = "hectormine.csv"
radius_km = 100
[catalog.columns]
datetime = "time"
lat = "latitude"
lon = "longitude"
mag = "mag"
mag_type = "magType"
[mainshock]
t = "1999-10-16 09:46:44.46"
lat = 34.6033
lon = -116.265
mw = 7.1
[analysis]
window_days = 180
n_boot = 200
n_fit_simulations = 600
seed = 0
